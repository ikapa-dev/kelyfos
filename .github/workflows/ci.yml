# KelyfOS — the pipeline that has to be green on main (P3-6).
#
# Three things, in the order they fail fastest:
#   1. checks   — vet, unit tests, gofmt. Seconds, catches most mistakes.
#   2. build    — both architectures from source, in parallel.
#   3. boot     — x86_64 actually boots on the runner's KVM and answers a
#                 command. aarch64 is build-only here and boot-verified on the
#                 dev machine, because GitHub's arm64 runners do not expose KVM.
#
# Two things temper the cost of (2), because a from-source Buildroot run is
# measured in tens of minutes:
#   - a docs-only change skips build and boot entirely. `checks` still runs, so
#     an edit to PLAN.html is still audited by tools/check-plan.py.
#   - Buildroot's download directory, its per-arch output tree and the compiler
#     cache are all restored between runs. The first two were already here; the
#     ccache half arrives with BR2_CCACHE in the shared Buildroot fragment.
# And one thing keeps them honest: the weekly scheduled run restores no cache at
# all, so a build that only works because of what a cache is holding fails
# within seven days instead of on the day someone finally clones the repo.
#
# The benchmark lives in bench.yml and stays manual: it takes an hour and its
# numbers are a claim about hardware, not a regression gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: >-
          Which image flavor to build. The default is what CI checks on every
          push; a release needs `dev`, which is the flavor the quickstart, the
          cookbook and every recipe name.
        type: choice
        options: [base, dev]
        default: base
  schedule:
    # Mondays, 04:23 UTC — the cache-free full build. An odd minute on purpose:
    # GitHub drops scheduled runs that pile up on the hour.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  # On main, every commit gets a group of its own, keyed on its sha. Elsewhere,
  # one group per ref and event.
  #
  # cancel-in-progress: false is not enough on its own, and finding that out
  # cost a second attempt at this. GitHub's concurrency model cancels a
  # *pending* run when a newer one queues behind the same in-progress run, so
  # with one shared group a rapid three-push sequence still loses the middle
  # commit — which is exactly the sequence this project's protocol produces:
  # the work, then STATUS.md. A per-sha group means main's runs never queue
  # behind each other and none of them can be superseded. Every commit on main
  # is one someone may bisect to, so every one of them gets built.
  #
  # The event is in the key as well, so a push cannot displace the weekly
  # from-source build that is the whole point of the schedule.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Does this change touch anything a compiler cares about? Answered with git
  # rather than a marketplace action: the rule is four lines of shell, and a
  # third-party action in the path of every build is a supply-chain dependency
  # bought for nothing.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          verdict () { echo "$2"; echo "code=$1" >> "$GITHUB_OUTPUT"; exit 0; }

          # Only a push or a pull request has a base to compare against. A manual
          # run or the weekly schedule is asking for the whole pipeline.
          case "$EVENT" in
            push|pull_request) ;;
            *) verdict true "event $EVENT: running everything" ;;
          esac

          # A brand-new branch reports an all-zero base, and a force-push can
          # leave one that no longer exists. Neither is a reason to skip a build.
          if [ -z "${BASE:-}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            verdict true "no usable base commit (${BASE:-empty}): running everything"
          fi

          changed="$(git diff --name-only "$BASE" "$HEAD")"
          echo "changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # Documentation is: anything under docs/, any Markdown file anywhere,
          # the two machine-reader files, the two plan documents and the licence.
          # Everything else — Go, the Makefile, versions.mk, the Buildroot tree,
          # this workflow — is code. llms.txt and llms-full.txt are named
          # explicitly because they are generated documentation with a .txt
          # extension, and without them a regenerated index would start an hour
          # of Buildroot for nothing.
          rest="$(printf '%s\n' "$changed" \
                  | grep -vE '^docs/|\.md$|^llms\.txt$|^llms-full\.txt$|^PLAN\.html$|^PLAN-FEATURES\.html$|^LICENSE$' \
                  | grep -v '^$' || true)"

          if [ -z "$rest" ]; then
            verdict false "documentation only: skipping build and boot"
          fi
          echo "not documentation:"
          printf '%s\n' "$rest" | sed 's/^/  /'
          verdict true "code changed: running the full pipeline"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . || true)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The integration tests skip themselves without KVM and an image, so this
      # runs the unit tests and proves the integration ones at least compile.
      - name: unit tests
        run: go test -count=1 ./...

      # A short mutation pass over every parser on a trust boundary (P6-3). The
      # seed corpora already ran above as ordinary subtests; this is the part
      # that goes looking. Ten seconds a target is not a search — the real one
      # is the scheduled run in security.yml — but it catches a parser that a
      # change just made trivially reachable, on the commit that made it so.
      #
      # The targets are discovered rather than listed, so a new one is picked up
      # here with nothing to remember. See dev/fuzz.sh.
      - name: fuzz, briefly
        run: make fuzz FUZZTIME=10s

      # A crasher is written into the package's testdata/fuzz/<Target>/ and is
      # the whole value of the run. On an ephemeral runner it is lost unless it
      # leaves, so it leaves.
      - name: keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers-${{ github.run_id }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 30

      - name: the plan is still coherent
        run: python3 tools/check-plan.py

      # The generated reference is regenerated from the source and compared. A
      # flag that exists and is not in docs/reference, or one in docs/reference
      # that no longer exists, fails here rather than reaching a reader (F-D4,
      # E3-1). This runs in `checks` rather than in `build` on purpose: it is
      # seconds, it needs no image, and it has to run on a documentation-only
      # commit — which is exactly the commit most able to make it wrong.
      - name: The generated reference still matches the source
        run: |
          set -euo pipefail
          make docs
          generated="docs/reference llms.txt llms-full.txt"
          if ! git diff --quiet -- $generated || \
             [ -n "$(git status --porcelain -- $generated)" ]; then
            echo
            echo "the generated documentation disagrees with the source:"
            git --no-pager diff -- $generated
            git status --porcelain -- $generated
            echo
            echo "Run 'make docs' and commit the result."
            exit 1
          fi
          echo "the reference, llms.txt and llms-full.txt all match"

      # The cheap half of the cookbook gate. Extraction and shell syntax are
      # checked on every commit here; the recipes are actually *run* in
      # cookbook.yml, which needs KVM, Firecracker and the dev image and is
      # therefore not something every commit can afford (F-D30).
      - name: Every cookbook recipe extracts and parses
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          go run ./tools/cookbook -in docs/cookbook.md -out "$out"
          for r in "$out"/*.sh; do
            bash -n "$r" || { echo "$(basename "$r"): shell syntax error"; exit 1; }
            echo "  ok  $(basename "$r" .sh)"
          done

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      # Restore and save are separate steps on purpose. A post step is skipped
      # once any step in the job has failed, so a build that dies half way
      # through throws away the toolchain it had just spent an hour on — and a
      # failing build is exactly the one you are about to re-run.
      - name: Cache Buildroot downloads
        id: dl
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kelyfos/dl
          key: kelyfos-dl-${{ hashFiles('versions.mk') }}
          restore-keys: kelyfos-dl-

      # The toolchain is the expensive half and depends only on the pinned
      # versions and the fragments that configure it.
      - name: Cache the Buildroot tree
        id: tree
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kelyfos/build/${{ matrix.arch }}-base
          key: kelyfos-tree-${{ matrix.arch }}-${{ hashFiles('versions.mk', 'image/buildroot/configs/*', 'image/buildroot/kernel/*') }}
          restore-keys: kelyfos-tree-${{ matrix.arch }}-

      # Deliberately no restore-keys: Buildroot's own documentation makes
      # purging the compiler cache the user's job when the compiler changes, and
      # versions.mk is what changes it. A bump therefore starts a clean cache
      # instead of inheriting objects built by a toolchain that no longer exists.
      - name: Cache the compiler cache
        id: ccache
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kelyfos/ccache
          key: kelyfos-ccache-${{ matrix.arch }}-${{ hashFiles('versions.mk') }}

      - name: Install build dependencies
        run: bash dev/install-build-deps.sh

      - name: Build the guest image
        run: make image ARCH=${{ matrix.arch }} FLAVOR=${{ inputs.flavor || 'base' }}

      # Printed rather than asserted: a hit rate is a fact about the cache, not a
      # property of the build, and a weekly run is meant to show 0%.
      - name: Compiler cache statistics
        if: always()
        run: |
          ccache=~/.cache/kelyfos/build/${{ matrix.arch }}-base/host/bin/ccache
          if [ -x "$ccache" ]; then
            "$ccache" --show-stats --verbose || "$ccache" -s
          else
            echo "no ccache binary at $ccache — the build did not get that far"
          fi

      # The weekly run restores nothing and therefore saves nothing: its whole
      # job is to prove the build works without a cache, and refreshing one from
      # it would make the next week's run a little less honest.
      - name: Save the Buildroot tree
        if: always() && github.event_name != 'schedule' && steps.tree.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kelyfos/build/${{ matrix.arch }}-base
          key: ${{ steps.tree.outputs.cache-primary-key }}

      - name: Save the downloads
        if: always() && github.event_name != 'schedule' && steps.dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kelyfos/dl
          key: ${{ steps.dl.outputs.cache-primary-key }}

      - name: Save the compiler cache
        if: always() && github.event_name != 'schedule' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kelyfos/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: |
            ~/.cache/kelyfos/out/${{ matrix.arch }}/vmlinux
            ~/.cache/kelyfos/out/${{ matrix.arch }}/Image
            ~/.cache/kelyfos/out/${{ matrix.arch }}/rootfs.ext4
            ~/.cache/kelyfos/out/${{ matrix.arch }}/image.json
          if-no-files-found: error
          retention-days: 7

  boot:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Standard Linux runners expose /dev/kvm as root:kvm 0660 with the runner
      # user outside the group; without this every boot fails with a permission
      # error that looks like a Firecracker bug.
      - name: Grant access to /dev/kvm
        run: |
          set -eux
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install Firecracker
        run: bash dev/install-firecracker.sh

      - uses: actions/download-artifact@v4
        with:
          name: image-x86_64
          path: ~/.cache/kelyfos/out/x86_64

      - name: Smoke test — boot and run a command
        run: |
          set -o pipefail
          make cli
          ./bin/kelyfos doctor --arch x86_64
          ./bin/kelyfos run --arch x86_64 --image "${{ inputs.flavor || 'base' }}" > run.log 2>&1 &
          RUN_PID=$!
          for i in $(seq 1 150); do grep -q "ready in" run.log && break; sleep 0.2; done
          cat run.log
          grep -q "ready in" run.log || { echo "the guest never became ready"; exit 1; }

          out="$(./bin/kelyfos exec 'uname -a')"
          echo "$out"
          echo "$out" | grep -q "Linux kelyfos" || { echo "unexpected uname output"; exit 1; }
          echo "$out" | grep -q "x86_64"       || { echo "wrong architecture"; exit 1; }

          ./bin/kelyfos exec 'cat /etc/os-release' | grep -q 'ID=kelyfos' \
            || { echo "the guest does not identify as KelyfOS"; exit 1; }

          # The audit record has to survive its own session.
          SID="$(./bin/kelyfos log --list | awk 'NR==1{print $1}')"
          ./bin/kelyfos log --session "$SID" --verify

          kill -INT $RUN_PID; wait $RUN_PID || true
          # Written when a sandbox's run directory was a direct child of run/.
          # Under the jailer the layout is run/firecracker/<id>/root, and
          # run/firecracker is a structural level the jailer's own path scheme
          # requires — teardown removes the sandbox, not the level above it, so
          # an emptiness test on run/ has been failing since P5-1 while nothing
          # was actually left behind. Test the claim instead: no sandbox state
          # and no sockets survive, wherever they were.
          left="$(find ~/.cache/kelyfos/run \( -name sandbox.json -o -name 'v.sock*' \
                    -o -name config.json -o -name 'fc.sock' \) 2>/dev/null)"
          if [ -n "$left" ]; then
            echo "teardown left a sandbox behind:"
            find ~/.cache/kelyfos/run -mindepth 1 | head -20
            exit 1
          fi
          echo "smoke test passed"

      # P5-2. The reference architecture is x86_64 (D15) and this is the only
      # place a real x86_64 VMM runs, so this is where its filter is read out of
      # the kernel and compared with what dev/expect records. The aarch64 half
      # is proved on the dev machine.
      - name: The host syscall filter, proved and recorded
        run: |
          set -o pipefail
          ARCH=x86_64 bash dev/accept-seccomp.sh 2>&1 | tee seccomp.log

      - name: Publish what that filter permits
        if: always()
        run: |
          {
            echo '## Host syscall filter — x86_64'
            echo
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' seccomp.log | tail -45
            echo '```'
            # Present only until the record for this architecture is committed;
            # after that the diff above is the answer and this is silent.
            if [ -f dev/expect/host-seccomp-x86_64.txt.observed ]; then
              echo
              echo '<details><summary>what this run observed, verbatim</summary>'
              echo
              echo '```'
              cat dev/expect/host-seccomp-x86_64.txt.observed
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-seccomp-x86_64
          path: |
            dev/expect/host-seccomp-x86_64.txt.observed
            seccomp.log
          if-no-files-found: warn

      - name: Integration tests against a real microVM
        run: go test -count=1 -timeout 20m -run 'TestConcurrent|TestOrphans|TestExec|TestMCP' ./internal/sandbox/
