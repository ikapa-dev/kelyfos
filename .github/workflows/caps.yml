# KelyfOS — the resource caps, proved on hardware that can actually strain them.
#
# Epic E1's caps are claims until something inside a guest tries to exceed each
# one and the host watches it fail (E1-8). This workflow is where that happens,
# and it is deliberately separate from ci.yml: it takes tens of minutes, it
# needs the dev flavor rather than base, and its numbers are a statement about
# hardware rather than a regression gate.
#
# Decision D15 makes a bare-KVM x86_64 runner the environment that *defines*
# whether a resource number is met. Under nested virtualisation a guest cannot
# generate enough demand to make a CPU cap visible at all, so a local run of the
# same script is informational and this one is not.
name: caps

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Guest architecture"
        required: false
        default: "x86_64"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ARCH: ${{ github.event.inputs.arch || 'x86_64' }}
    steps:
      - uses: actions/checkout@v4

      - name: Grant access to /dev/kvm
        run: |
          set -eux
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Printed, not fixed. KelyfOS enables the cpu controller on the root cgroup
      # itself when it needs to and is root, which is the only cgroup that may
      # both hold processes and delegate controllers; doing it here as well
      # would hide whether that path works. What this step buys is a readable
      # record of the cgroup layout when something does go wrong.
      - name: Show the cgroup layout
        run: |
          set -eux
          cat /sys/fs/cgroup/cgroup.controllers
          cat /sys/fs/cgroup/cgroup.subtree_control
          cat /proc/self/cgroup

      - name: Cache Buildroot downloads
        id: dl
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kelyfos/dl
          key: kelyfos-dl-${{ hashFiles('versions.mk') }}
          restore-keys: kelyfos-dl-

      - name: Cache the Buildroot tree
        id: tree
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kelyfos/build/${{ env.ARCH }}-dev
          key: kelyfos-tree-${{ env.ARCH }}-dev-${{ hashFiles('versions.mk', 'image/buildroot/configs/*', 'image/buildroot/kernel/*', 'image/flavors/dev/*') }}
          restore-keys: kelyfos-tree-${{ env.ARCH }}-dev-

      - name: Cache the compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kelyfos/ccache
          key: kelyfos-ccache-${{ env.ARCH }}-${{ hashFiles('versions.mk') }}

      - name: Install build dependencies
        run: bash dev/install-build-deps.sh

      - name: Install Firecracker
        run: bash dev/install-firecracker.sh

      - name: Build the dev image
        run: make image ARCH="$ARCH" FLAVOR=dev

      - name: Build the CLI
        run: make cli

      # As root, and for one reason: a CPU quota needs to create a cgroup and
      # place a process in it, and a GitHub runner has no systemd user session
      # to ask on its behalf. HOME is passed explicitly rather than trusted to
      # survive sudo, because the image built in the step above lives under it
      # and root's HOME is a different directory with no image in it.
      - name: Prove the caps
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" ARCH="$ARCH" \
            bash dev/prove-caps.sh 2>&1 | tee caps.log

      # A team's collective cap needs five guests' worth of demand to be
      # exceedable at all, so it needs this environment even more than a single
      # sandbox's quota does (E2-6, D15).
      - name: Prove the team budget
        if: always()
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" ARCH="$ARCH" \
            bash dev/prove-team.sh 2>&1 | tee team.log

      # Epic E2's proof demo, run where its spawn bar means something: a team
      # of five is the one measurement a nested host cannot make (E2-9, D15).
      - name: Run the agent-teams proof demo
        if: always()
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" ARCH="$ARCH" \
            bash dev/demo-team.sh 2>&1 | tee demo.log

      # The epic's acceptance list, run where its two measured steps mean
      # something. The behaviour it checks is the same everywhere; the CPU quota
      # and the download throughput are not (D15).
      - name: Run Epic E1's acceptance list
        if: always()
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" ARCH="$ARCH" \
            bash dev/accept-e1.sh 2>&1 | tee accept.log

      # §1 criterion 5, which had no owner until P6-18: the E2B-compatible
      # surface driven over a real socket against real microVMs. It tests the
      # half this project owns rather than pinning somebody else's SDK, and D51
      # is the decision and the reasoning.
      - name: Run the E2B shim's acceptance suite
        if: always()
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" ARCH="$ARCH" \
            bash dev/accept-shim.sh 2>&1 | tee shim.log

      - name: Publish the verdict
        if: always()
        run: |
          {
            echo "### Resource caps — bare-KVM reference"
            echo
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' caps.log
            echo '```'
            if [ -f team.log ]; then
              echo
              echo "### Team budget — bare-KVM reference"
              echo
              echo '```'
              sed -e 's/\x1b\[[0-9;]*m//g' team.log
              echo '```'
            fi
            if [ -f demo.log ]; then
              echo
              echo "### Epic E2 proof demo — bare-KVM reference"
              echo
              echo '```'
              sed -e 's/\x1b\[[0-9;]*m//g' demo.log
              echo '```'
            fi
            if [ -f accept.log ]; then
              echo
              echo "### Epic E1 acceptance — bare-KVM reference"
              echo
              echo '```'
              sed -e 's/\x1b\[[0-9;]*m//g' accept.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caps-${{ env.ARCH }}
          path: |
            caps.log
            team.log
            demo.log
            team.html
            accept.log
          if-no-files-found: warn

      # Saved explicitly, and with if: always(), because a post step is skipped
      # once any step has failed — which cost forty-five minutes the first time
      # this workflow found a real bug, since the failing run threw away the
      # toolchain it had just spent that long building. The runs worth iterating
      # on are exactly the ones that fail.
      - name: Save the Buildroot tree
        if: always() && steps.tree.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kelyfos/build/${{ env.ARCH }}-dev
          key: ${{ steps.tree.outputs.cache-primary-key }}

      - name: Save the downloads
        if: always() && steps.dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kelyfos/dl
          key: ${{ steps.dl.outputs.cache-primary-key }}

      - name: Save the compiler cache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kelyfos/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
