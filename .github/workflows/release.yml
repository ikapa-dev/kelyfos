# The release, built and published by CI rather than by a laptop (P6-8).
#
# Every release this project has cut was assembled by hand, and the v0.9
# artifacts prove it: the two architectures were built on two different machines,
# one of them the developer's. Nothing above the weakest provenance claim is
# reachable while that is true — an attestation over bytes a laptop produced
# attests to the laptop — so this changes first, and P6-11's attestations are
# built on top of it.
#
# What this workflow is, precisely: both architectures built from this tag's
# source, both CLIs cross-built, `dist/` staged, `SHA256SUMS` regenerated from
# scratch over exactly what is there, and a draft release published. It is not a
# provenance claim by itself. It is the thing that makes one possible.
#
# **The release is drafted, never published outright.** The last step before a
# stranger downloads anything is a person looking at it, and a workflow that
# published on a tag would take that person out of a loop they are the point of.
name: release

on:
  push:
    tags: ["v*"]
  # So the whole path can be exercised without cutting a tag. It builds and
  # stages and stops: a dispatch has no tag to publish against, and inventing
  # one would make the rehearsal a different thing from the performance.
  workflow_dispatch:
    inputs:
      ref:
        description: "commit or tag to build (defaults to the branch this is run from)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: guest image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        # The published image is the dev flavor, which is what the quickstart
        # downloads. CI's per-commit build is `base`; that difference is why the
        # cache key carries the flavor, and why a release build used to run cold
        # for about forty minutes.
        flavor: [dev]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: bash dev/install-build-deps.sh

      - name: Cache the Buildroot tree
        id: tree
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kelyfos/build/${{ matrix.arch }}-${{ matrix.flavor }}
          key: kelyfos-tree-${{ matrix.arch }}-${{ matrix.flavor }}-${{ hashFiles('versions.mk', 'image/buildroot/configs/*', 'image/buildroot/kernel/*') }}
          restore-keys: kelyfos-tree-${{ matrix.arch }}-${{ matrix.flavor }}-

      - name: Build the guest image
        run: make image ARCH=${{ matrix.arch }} FLAVOR=${{ matrix.flavor }}

      - name: Stage the artifacts
        run: make release-artifacts ARCH=${{ matrix.arch }} FLAVOR=${{ matrix.flavor }}

      - name: Save the Buildroot tree
        if: always() && steps.tree.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kelyfos/build/${{ matrix.arch }}-${{ matrix.flavor }}
          key: ${{ steps.tree.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: stage and publish
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Both architectures' images, from the two jobs above, into one dist/.
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: dist/
          merge-multiple: true

      # The CLIs are cross-built here rather than in the matrix: they are
      # cross-compiled anyway, so building them twice would produce the same two
      # binaries and leave a question about which pair was published.
      - name: Cross-build both CLIs
        run: make release-cli

      # From scratch, over exactly what is staged. Both targets above used to
      # append to this file and nothing truncated it (P6-8).
      - name: Write SHA256SUMS
        run: make release-sums

      # A release that lists an artifact it does not carry, or carries one it
      # does not list, is a release whose checksums file cannot be used for the
      # thing it exists for. Checked here rather than trusted, because the two
      # halves are produced by different jobs.
      - name: The sums file describes exactly what is here
        run: |
          set -euo pipefail
          cd dist
          missing=0
          while read -r _ name; do
            [ -f "$name" ] || { echo "SHA256SUMS lists $name, which is not here"; missing=1; }
          done < SHA256SUMS
          for f in *; do
            [ "$f" = SHA256SUMS ] && continue
            grep -q "  $f\$" SHA256SUMS || { echo "$f is here and not in SHA256SUMS"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          sha256sum -c SHA256SUMS
          echo "SHA256SUMS covers $(wc -l < SHA256SUMS) artifacts, and every one of them is here"

      - name: What is being published
        run: ls -la dist/

      # Drafted, so the last step before a stranger downloads anything is a
      # person looking at it. A dispatch has nothing to publish against and stops
      # here, having proved the whole path up to this point.
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" dist/* \
            --draft \
            --title "$tag" \
            --notes "Built by .github/workflows/release.yml from ${GITHUB_SHA}.

          Both architectures were built from this tag's source in one workflow run.
          \`SHA256SUMS\` was regenerated from scratch over exactly the files attached here.

          \`dev/fetch-image.sh\` verifies downloads against that file."
