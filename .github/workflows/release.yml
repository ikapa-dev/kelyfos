# The release, built and published by CI rather than by a laptop (P6-8).
#
# Every release this project has cut was assembled by hand, and the v0.9
# artifacts prove it: the two architectures were built on two different machines,
# one of them the developer's. Nothing above the weakest provenance claim is
# reachable while that is true — an attestation over bytes a laptop produced
# attests to the laptop — so this changes first, and P6-11's attestations are
# built on top of it.
#
# What this workflow is, precisely: both architectures built from this tag's
# source, all four CLIs cross-built, `dist/` staged, `SHA256SUMS` regenerated from
# scratch over exactly what is there, and a draft release published. It is not a
# provenance claim by itself. It is the thing that makes one possible.
#
# **The release is drafted, never published outright.** The last step before a
# stranger downloads anything is a person looking at it, and a workflow that
# published on a tag would take that person out of a loop they are the point of.
name: release

on:
  push:
    tags: ["v*"]
  # So the whole path can be exercised without cutting a tag. It builds and
  # stages and stops: a dispatch has no tag to publish against, and inventing
  # one would make the rehearsal a different thing from the performance.
  workflow_dispatch:
    inputs:
      ref:
        description: "commit or tag to build (defaults to the branch this is run from)"
        required: false

permissions:
  contents: write
  # What actions/attest needs to have a hosted platform sign a statement about
  # this run: an OIDC token to prove which workflow is asking, the right to write
  # the attestation, and the right to record it against the artifact (P6-11).
  #
  # Read off the action's own documentation rather than remembered. The obvious
  # guess — actions/attest-build-provenance@v1 with two permissions — is two
  # majors and one permission out of date: that action is a wrapper as of v4 and
  # its own README says new implementations should use actions/attest.
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: guest image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        # The published image is the dev flavor, which is what the quickstart
        # downloads. CI's per-commit build is `base`; that difference is why the
        # cache key carries the flavor, and why a release build used to run cold
        # for about forty minutes.
        flavor: [dev]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: bash dev/install-build-deps.sh

      - name: Cache the Buildroot tree
        id: tree
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kelyfos/build/${{ matrix.arch }}-${{ matrix.flavor }}
          key: kelyfos-tree-${{ matrix.arch }}-${{ matrix.flavor }}-${{ hashFiles('versions.mk', 'image/buildroot/configs/*', 'image/buildroot/kernel/*') }}
          restore-keys: kelyfos-tree-${{ matrix.arch }}-${{ matrix.flavor }}-

      - name: Build the guest image
        run: make image ARCH=${{ matrix.arch }} FLAVOR=${{ matrix.flavor }}

      - name: Stage the artifacts
        run: make release-artifacts ARCH=${{ matrix.arch }} FLAVOR=${{ matrix.flavor }}

      # Here rather than in the publish job, because the SBOM's largest half
      # comes from the Buildroot tree and that tree only exists on this runner.
      # The CLIs for this architecture are built first for the same reason: the
      # merge reads each binary's own build information rather than go.mod,
      # which is the difference between what was built and what was declared.
      - name: The SBOM for this architecture
        run: |
          make release-cli
          make release-sbom ARCH=${{ matrix.arch }} FLAVOR=${{ matrix.flavor }}
          # `make release-cli` builds four CLIs — Linux and macOS, each in two
          # architectures — and this job wants none of them: it built them only so
          # the SBOM could read a binary's own build information. All four go, so
          # that both matrix jobs cannot upload the same macOS filenames and leave
          # a question about which pair the merge kept. The publish job builds the
          # four it ships, once, over the merged `dist/`.
          rm -f dist/kelyfos-linux-* dist/kelyfos-darwin-*

      - name: Save the Buildroot tree
        if: always() && steps.tree.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kelyfos/build/${{ matrix.arch }}-${{ matrix.flavor }}
          key: ${{ steps.tree.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: stage and publish
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Both architectures' images, from the two jobs above, into one dist/.
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: dist/
          merge-multiple: true

      # The CLIs are cross-built here rather than in the matrix: they are
      # cross-compiled anyway, so building them twice would produce the same four
      # binaries and leave a question about which set was published.
      - name: Cross-build all four CLIs
        run: make release-cli

      # From scratch, over exactly what is staged — which now includes both
      # SBOMs, so they are covered by the file a stranger verifies against
      # rather than published beside it (P6-10).
      - name: Write SHA256SUMS
        run: make release-sums

      # A release that lists an artifact it does not carry, or carries one it
      # does not list, is a release whose checksums file cannot be used for the
      # thing it exists for. Checked here rather than trusted, because the two
      # halves are produced by different jobs.
      - name: The sums file describes exactly what is here
        run: |
          set -euo pipefail
          cd dist
          missing=0
          while read -r _ name; do
            [ -f "$name" ] || { echo "SHA256SUMS lists $name, which is not here"; missing=1; }
          done < SHA256SUMS
          for f in *; do
            [ "$f" = SHA256SUMS ] && continue
            grep -q "  $f\$" SHA256SUMS || { echo "$f is here and not in SHA256SUMS"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          sha256sum -c SHA256SUMS
          echo "SHA256SUMS covers $(wc -l < SHA256SUMS) artifacts, and every one of them is here"

      # Provenance: a hosted platform signing a statement about which workflow,
      # from which commit, produced these bytes. That is SLSA v1.0 Build Level 2
      # and it verifies offline against a trusted root fetched once (P6-11, D39).
      #
      # Over the checksums file KelyfOS already produces, in the format it
      # already produces it — one attestation covering every asset rather than
      # one per file, which is the shape actions/attest is built for and the
      # shape a stranger checks in a single command.
      #
      # **This is not the same claim as GitHub's immutable-release attestation**,
      # which carries no builder identity at all and asserts only that GitHub
      # received these bytes under this tag. That one is a separate owner
      # setting, worth having, and the two must never be described with one
      # sentence (D39).
      - name: Attest the artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      # A second and third attestation, over the SBOMs — one per architecture,
      # because there is one SBOM per architecture and an attestation that
      # pointed at both sets of artifacts would be claiming that either SBOM
      # describes either image.
      #
      # "These are the bytes this workflow built" and "this is what is in them"
      # are two statements, and a reader may want either without the other.
      #
      # The subject glob is wide on purpose, and what keeps it honest lives in
      # the Makefile: `release-sbom` reads every CLI binary staged for this
      # architecture, the macOS one included. Widening what `dist/*` matches
      # without widening what the SBOM reads is exactly how this claim goes
      # false, and it did once — the macOS CLI shipped, this glob matched it,
      # and no SBOM had ever opened it. `TestEverySBOMSubjectIsABinaryTheSBOMRead`
      # in tools/sbom is what now notices if the two drift apart again.
      - name: Attest the aarch64 SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: "dist/*aarch64*"
          sbom-path: dist/sbom-aarch64.cdx.json

      - name: Attest the x86_64 SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: "dist/*x86_64*"
          sbom-path: dist/sbom-x86_64.cdx.json

      - name: What is being published
        run: ls -la dist/

      # Drafted, so the last step before a stranger downloads anything is a
      # person looking at it. A dispatch has nothing to publish against and stops
      # here, having proved the whole path up to this point.
      # The notes come out of CHANGELOG.md, which is the source rather than a
      # mirror (D50). A tag with no section there does not get published: the
      # alternative is a release whose notes are written once, in a web form,
      # where nothing in this repository can ever check them again.
      - name: The notes for this tag, from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          python3 tools/changelog.py "$tag" > /tmp/notes.md
          echo "--- notes for $tag ---"
          cat /tmp/notes.md

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          {
            cat /tmp/notes.md
            echo
            echo "---"
            echo
            echo "Built by \`.github/workflows/release.yml\` from ${GITHUB_SHA}."
            echo
            echo "Both architectures were built from this tag's source in one workflow run."
            echo "\`SHA256SUMS\` was regenerated from scratch over exactly the files attached here."
            echo
            echo "\`dev/fetch-image.sh\` verifies downloads against that file."
          } > /tmp/body.md
          gh release create "$tag" dist/* \
            --draft \
            --title "$tag" \
            --notes-file /tmp/body.md
