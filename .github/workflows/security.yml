# KelyfOS — the checks that run when nothing has changed (P6-2, P6-3).
#
# Both jobs here answer the same shape of question, which is why they share a
# workflow: what can become true about code that did not change? For
# govulncheck it is knowledge arriving from outside — an advisory published
# against a dependency that has not moved. For fuzzing it is knowledge that was
# always there and had not been found yet. Neither is discoverable by a trigger
# that waits for a push.
#
# govulncheck was already part of this project's discipline before it was part
# of its CI: it has been run by hand at ten or more gates and once caught a real
# advisory in a transitive dependency (GO-2026-5024, recorded in docs/decisions.md). The
# problem with a discipline is that it only runs when somebody remembers, and
# the failure mode it is guarding against does not need anybody to do anything:
# an advisory is published against a dependency that has not moved, and a
# repository that was clean on Monday is vulnerable on Tuesday having changed
# nothing. A scanner that only runs on push cannot see that. That is why the
# schedule is the point of this file and the push trigger is the afterthought.
#
# Why its own workflow, and its own day. ci.yml's Monday cron exists to run the
# whole build with no caches restored, so a build that has quietly become
# dependent on a cache fails within the week; cookbook.yml has Tuesday. Mixing a
# vulnerability finding into either would muddy a signal that was designed to
# mean one thing. This one takes Wednesday.
#
# Why a finding fails the run rather than opening an issue. Everything in this
# product is fail-closed, and an issue-opening step needs write permissions plus
# a moving part that can itself break quietly. A red run on a repository whose
# main is otherwise green is the loudest available signal and needs no
# machinery — and CONTRIBUTING.md's "CI is the gate" already makes a red main a blocker that is
# fixed before any new task, which is the correct response to a live advisory in
# a dependency this project ships.
#
# The version is pinned like everything else (P0-6). Note that it is pinned from
# the module proxy rather than from GitHub releases: golang/vuln's releases page
# stops at v1.1.4 in January 2025, while the module has shipped through v1.7.0.
# Reading the wrong one would have pinned a scanner nineteen months stale.
name: security

on:
  schedule:
    # Wednesdays, 05:41 UTC. An odd minute on purpose: GitHub drops scheduled
    # runs that pile up on the hour.
    - cron: "41 5 * * 3"
  workflow_dispatch:
  # Not every push. A scan of an unchanged dependency set on an unchanged
  # database tells you what the last one did, and putting a network call to
  # vuln.go.dev on the hot path of every commit buys nothing. A dependency
  # change is the one push where the answer can differ, so that is the one that
  # runs it.
  push:
    branches: [main]
    paths: [go.mod, go.sum, .github/workflows/security.yml]
  pull_request:
    paths: [go.mod, go.sum, .github/workflows/security.yml]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Reachability-based, not a dependency-list diff: govulncheck reports a
      # vulnerable symbol only when this code can actually call it, which is why
      # it is worth running instead of reading a manifest. `./...` covers every
      # main package including dev/seccomp-probe and the two tools.
      - name: govulncheck
        run: make vuln

  # The real fuzzing run. ci.yml does ten seconds a target on every push, which
  # catches a parser a change just made reachable; this is the one that searches.
  # Separate job so a crasher and an advisory are never the same red X.
  fuzz:
    runs-on: ubuntu-latest
    # 120, not 90. The budget below is per target and the targets are run one
    # after another — `go test -fuzz` takes exactly one at a time — so the job
    # costs targets x FUZZTIME plus a build per package. At 90 that left no
    # margin: see the comment on the budget itself.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Targets are discovered, not listed (dev/fuzz.sh), so this line does not
      # change when one is added — but the COST does, and that is what went
      # wrong here. This said "three minutes each against fourteen targets is
      # comfortably inside the timeout with room for the set to grow". The set
      # grew: twenty-nine targets, 29 x 3m = 87 minutes of fuzzing against a
      # 90-minute timeout, before the per-package builds that precede it. The
      # margin was gone and the next target would have turned a slow job into a
      # red one — a timeout, on the workflow whose whole purpose is to be
      # believed when it goes red.
      #
      # So the budget follows the event, which is what this repository already
      # says it believes: ci.yml calls its own ten-second pass "not a search --
      # the real one is the scheduled run in security.yml". The scheduled run is
      # therefore the search, and a push or a pull request gets the smoke test.
      # This job runs on a push at all only when go.mod, go.sum or this file
      # change, so the short budget applies to a dependency bump proving itself,
      # not to ordinary work.
      - name: fuzz
        env:
          # 3m x 29 = 87 min weekly; 30s x 29 = 15 min on a dependency change.
          FUZZTIME: ${{ github.event_name == 'schedule' && '3m' || '30s' }}
        run: make fuzz FUZZTIME=$FUZZTIME

      - name: keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers-${{ github.run_id }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 30
