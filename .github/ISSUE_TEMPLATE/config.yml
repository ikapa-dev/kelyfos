# A blank issue is a question with no shape, and the two things this project most
# needs from a report — what it did instead, and how to make it do that again —
# are exactly what a blank box does not ask for.
blank_issues_enabled: false
contact_links:
  - name: A security vulnerability
    url: https://github.com/p4r4n0rm4l/KelyfOS/security/policy
    about: >-
      Do not open a public issue. SECURITY.md has the channel, what to include,
      and which findings are documented design decisions this project already
      publishes rather than defects.
  - name: Something the documentation got wrong
    url: https://github.com/p4r4n0rm4l/KelyfOS/issues/new?template=bug.yml
    about: >-
      A document that disagrees with the code is a defect and is wanted. Quote
      the sentence and name the file that contradicts it.
